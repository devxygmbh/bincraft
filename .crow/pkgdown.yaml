when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: ['R/**', 'pkgdown/**', '.crow/pkgdown.yaml']
  - event: manual
  - event: tag

steps:
  - name: Replace version for release runs
    image: reg.devxy.io/docker.io/library/alpine:3.24
    commands:
      - "sed -i 's/Version: .*/Version: ${CI_COMMIT_TAG#v}/' DESCRIPTION"
    when:
      - event: tag

  - name: Build pkgdown
    image: reg.devxy.io/r/r-alpine:4.5-3.23
    environment:
      GITHUB_PAT:
        from_secret: GITHUB_PAT
    pull: true
    commands:
      - apk add -q --no-cache pandoc libgit2-dev libxml2-dev
      - curl -fsSL https://raw.githubusercontent.com/nbafrank/uvr/main/install.sh | UVR_INSTALL_DIR=/usr/local/bin sh
      - uvr init
      # Point uvr at the image's fully-qualified binary slot, not the bare host.
      # A bare https://cran.rpkgs.com/ request 302-redirects to CRAN (bunny edge
      # fallback for unqualified paths), so uvr would build everything from
      # source. getOption("repos") already carries the right arch/codename slot.
      - REPO=$(R --no-echo -e 'cat(getOption("repos")[[1]])')
      - printf '\n[[sources]]\nname = "rpkgs"\nurl = "%s"\n' "$REPO" >> uvr.toml
      # `uvr add` writes the lockfile and installs; `uvr sync` needs that
      # lockfile, so it has to run after `uvr add`, not before.
      - uvr add pkgdown pat-s/cranlike@s3 pat-s/desc@description-from-remote
      - uvr sync
      # `uvr run` takes a script path; it has no `-e` flag.
      - printf 'pkgdown::build_site()\n' > build-site.R
      - uvr run build-site.R
      # docs/ is in gitignore
      - mv docs/ /tmp/public
      - mv .git /tmp/.git
      - mv statichost.yaml /tmp/statichost.yaml
      - rm -rf ./* .[^.]* ..?*
      - mv /tmp/public/* ./ && mv /tmp/.git ./ && mv /tmp/statichost.yaml .

  - name: 'Push changes to branch'
    image: reg.devxy.io/docker.io/appleboy/drone-git-push:1.2.3
    settings:
      remote: ${CI_REPO_CLONE_SSH_URL}
      branch: pkgdown
      commit: true
      force: true
      ssh_key:
        from_secret: rpkgs_bot_ssh_key
      commit_message: '[skip ci] Update pkgdown ${CI_COMMIT_SHA}'
      author_name: rpkgs-bot
      author_email: bot@rpkgs.com
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
      - event: tag
