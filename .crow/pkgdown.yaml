when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: ['R/**', 'pkgdown/**', '.crow/pkgdown.yaml']
  - event: manual
  - event: tag

steps:
  - name: Replace version for release runs
    image: reg.devxy.io/docker.io/library/alpine:3.23
    commands:
      - "sed -i 's/Version: .*/Version: ${CI_COMMIT_TAG#v}/' DESCRIPTION"
    when:
      - event: tag

  - name: Build pkgdown
    image: reg.devxy.io/r/r-alpine:4.5-3.23
    environment:
      GITHUB_PAT:
        from_secret: GITHUB_PAT
    pull: true
    commands:
      - apk add -q --no-cache pandoc
      - R -q -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
      - R -q -e 'options(Ncpus = 4)'
      - R -q -e 'dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE)'
      - R -q -e 'pak::pak()'
      - R -q -e 'pak::pak("pkgdown")'
      - R -q -e 'pkgdown::build_site()'
      # docs/ is in gitignore
      - mv docs/ /tmp/public
      - mv .git /tmp/.git
      - mv statichost.yaml /tmp/statichost.yaml
      - rm -rf ./* .[^.]* ..?*
      - mv /tmp/public/* ./ && mv /tmp/.git ./ && mv /tmp/statichost.yaml .

  - name: 'Push changes to branch'
    image: reg.devxy.io/docker.io/appleboy/drone-git-push:1.2.2
    settings:
      remote: ${CI_REPO_CLONE_SSH_URL}
      branch: pkgdown
      commit: true
      force: true
      ssh_key:
        from_secret: rpkgs_bot_ssh_key
      commit_message: '[skip ci] Update pkgdown ${CI_COMMIT_SHA}'
      author_name: rpkgs-bot
      author_email: bot@rpkgs.com
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
      - event: tag
