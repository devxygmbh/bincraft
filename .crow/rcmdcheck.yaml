when:
  - event: pull_request
    path: 'R/**'
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: 'R/**'
  - event: manual

steps:
  'Check package':
    image: docker.io/devxygmbh/r-alpine:4.4-3.21
    pull: true
    environment:
      GITHUB_PAT:
        from_secret: GITHUB_PAT
      RCMDCHECK_NUM_COLORS: 300
    commands:
      - R -q -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/devel/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
      - R -q -e 'options(Ncpus = 4)'
      - R -q -e 'dir.create(Sys.getenv("R_LIBS_USER"), recursive = TRUE)'
      - R -q -e 'pak::pak(dependencies = TRUE)'
      - R -q -e 'pak::pak("r-lib/rcmdcheck", dependencies = TRUE)'
      - R -q -e 'rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning")'
