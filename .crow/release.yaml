when:
  - event: tag

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.6.3
    settings:
      tags: true

depends_on:
  - rcmdcheck

steps:
  changelog:
    image: docker.io/thegeeklab/git-sv:1.0.14
    commands:
      - apk add --no-cache -q sed
      - git sv current-version
      - git sv release-notes -t ${CI_COMMIT_TAG} -o CHANGELOG.md
      - sed -i '1,2d' CHANGELOG.md # remove version
      - cat CHANGELOG.md
    when:
      event: tag

  'Create release':
    image: docker.io/woodpeckerci/plugin-release:0.2.5
    settings:
      note: CHANGELOG.md
      api_key:
        from_secret: codefloe_rpkgs_bot_token
      files:
        - dist/*.tar.gz
      title: ${CI_COMMIT_TAG}
    when:
      event: tag