when:
  - event: tag

clone:
  git:
    image: codefloe.com/crow-plugins/clone:1.0.4
    settings:
      tags: true

depends_on:
  - rcmdcheck

steps:
  changelog:
    image: reg.devxy.io/docker.io/thegeeklab/git-sv:2.1.1
    commands:
      - apk add --no-cache -q sed
      # replace version in DESCRIPTION
      - "sed -i 's/Version: .*/Version: ${CI_COMMIT_TAG#v}.9999/' DESCRIPTION"
      - git sv current-version
      - git sv release-notes -t ${CI_COMMIT_TAG} -o CHANGELOG.md
      - sed -i '1,2d' CHANGELOG.md # remove version
      - cat CHANGELOG.md
    when:
      event: tag

  'Create release':
    image: reg.devxy.io/docker.io/woodpeckerci/plugin-release:0.3.1
    settings:
      note: CHANGELOG.md
      api_key:
        from_secret: codefloe_rpkgs_bot_token
      files:
        - dist/*.tar.gz
      title: ${CI_COMMIT_TAG}
    when:
      event: tag

  'Push changes to repo':
    image: reg.devxy.io/docker.io/appleboy/drone-git-push:1.2.3
    settings:
      remote: ${CI_REPO_CLONE_SSH_URL}
      branch: main
      commit: true
      pull: true
      ssh_key:
        from_secret: rpkgs_bot_ssh_key
      commit_message: '[skip ci] Update version in DESCRIPTION after release'
      commit_author: devxy-bot
      commit_author_email: no-reply@devxy.io
    when:
      - event: tag
