when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: tag

steps:
  - name: editorconfig
    image: reg.devxy.io/docker.io/mstruebing/editorconfig-checker:v3.11.1
    depends_on: []

  - name: prettier
    image: reg.devxy.io/docker.io/woodpeckerci/plugin-prettier:1.4.1
    depends_on: []

  - name: lint-r-jarl
    image: reg.devxy.io/r/r-alpine:4.6-3.22
    environment:
      JARL_VERSION: '0.5.0'
    commands:
      - apk add --no-cache -q curl ca-certificates
      # Fetch the installer to /tmp, not the workspace: steps share one clone,
      # so a downloaded jarl-installer.sh would be linted by the editorconfig
      # step (it is a third-party script and fails those checks).
      - curl -sL "https://github.com/etiennebacher/jarl/releases/download/$JARL_VERSION/jarl-installer.sh" -o /tmp/jarl-installer.sh
      - sh /tmp/jarl-installer.sh
      - source $HOME/.local/bin/env
      - jarl check ./R/

  - name: format-r
    image: reg.devxy.io/docker.io/library/buildpack-deps:trixie-curl
    commands:
      - curl -LsSf https://github.com/posit-dev/air/releases/latest/download/air-installer.sh | INSTALLER_PRINT_QUIET=1 sh
      - . $HOME/.local/bin/env && air format --check R/

  - name: lint-markdown
    image: reg.devxy.io/docker.io/davidanson/markdownlint-cli2:v0.23.2
    depends_on: []
    commands:
      - 'markdownlint-cli2 *.{md,markdown}'
    when:
      path: '*.{md,markdown}'
