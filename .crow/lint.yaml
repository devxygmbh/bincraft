when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: editorconfig
    image: reg.devxy.io/docker.io/mstruebing/editorconfig-checker:v3.6.1
    depends_on: []

  - name: prettier
    image: reg.devxy.io/docker.io/woodpeckerci/plugin-prettier:1.4.1
    depends_on: []

  - name: lint-r
    image: reg.devxy.io/docker.io/library/alpine:3.23
    commands:
      - apk add -q --no-cache curl
      - curl --proto '=https' --tlsv1.2 -LsSf https://github.com/etiennebacher/jarl/releases/latest/download/jarl-installer.sh | INSTALLER_PRINT_QUIET=1 sh
      - source $HOME/.local/bin/env && jarl check R/

  - name: format-r
    image: reg.devxy.io/docker.io/library/buildpack-deps:trixie-curl
    commands:
      - curl -LsSf https://github.com/posit-dev/air/releases/latest/download/air-installer.sh | INSTALLER_PRINT_QUIET=1 sh
      - . $HOME/.local/bin/env && air format --check R/

  - name: lint-markdown
    image: reg.devxy.io/docker.io/davidanson/markdownlint-cli2:v0.22.0
    depends_on: []
    commands:
      - 'markdownlint-cli2 *.{md,markdown}'
    when:
      path: '*.{md,markdown}'
