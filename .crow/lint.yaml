when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: editorconfig
    image: reg.devxy.io/docker.io/mstruebing/editorconfig-checker:v3.6.1
    depends_on: []

  - name: prettier
    image: reg.devxy.io/docker.io/woodpeckerci/plugin-prettier:1.4.1
    depends_on: []

  - name: lint-r
    image: reg.devxy.io/r/r-alpine:4-3.22
    environment:
      LINTR_ERROR_ON_LINT: true
    commands:
      - R -q -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
      - R -q -e 'pak::pak()'
      - R -q -e 'pak::pak(c("lintr", "cyclocomp", "pkgload"))'
      - R -q -e 'pkgload::load_all(); lintr::lint_package()'

  - name: styler
    image: reg.devxy.io/r/r-alpine:4-3.22
    commands:
      - R -q -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/stable/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
      - R -q -e 'pak::pak(c("styler", "roxygen2"))'
      - R -q -e 'styler::style_pkg(dry = "fail")'

  - name: lint-markdown
    image: reg.devxy.io/docker.io/davidanson/markdownlint-cli2:v0.21.0
    depends_on: []
    commands:
      - 'markdownlint-cli2 *.{md,markdown}'
    when:
      path: '*.{md,markdown}'
