url: https://bincraft.doc.rpkgs.com
template:
  bootstrap: 5
  light-switch: true
  bslib:
    bootswatch: yeti
    primary: '#306cc9'

    base_font: { google: 'Roboto' }
    heading_font: { google: 'Montserrat' }
    code_font: { google: 'JetBrains Mono' }

reference:
  - title: 'Main Workflow Functions'
    desc: 'High-level functions for the main binary building workflow'
    contents:
      - process_cran_updates
      - build_binary_package

  - title: 'CRAN Package Discovery'
    desc: 'Functions to discover package changes from CRAN'
    contents:
      - get_new_cran_packages
      - get_updated_cran_packages
      - get_removed_cran_packages
      - get_r_minor_sensitive_packages

  - title: 'ABI Classification'
    desc: 'Classify packages by ABI-risk tier to decide per-minor rebuild strategy'
    contents:
      - abi_classify
      - classify_r_minor_sensitive
      - needs_per_minor_recompile
      - abi_curated_lists

  - title: 'Archive Management'
    desc: 'Functions for archiving old package versions'
    contents:
      - archive_package
      - process_unarchived_pkgs
      - write_archive_rds

  - title: 'Upload & Storage'
    desc: 'Functions for uploading packages and managing S3 storage'
    contents:
      - upload_single_binary
      - upload_source_tarball
      - upload_package_index

  - title: 'Repository Index Management'
    desc: 'Functions for creating and managing CRAN-like repository indices'
    contents:
      - add_to_package_index

  - title: 'Metadata & Database'
    desc: 'Functions for managing build metadata and database operations'
    contents:
      - list_metadata_tables
      - query_metadata_table
      - query_packages_without_historic_versions
      - get_missing_pkgs_db

  - title: 'Utilities & Helpers'
    desc: 'Utility functions for configuration and checks'
    contents:
      - check_for_binary
      - set_bin_path
      - set_codename
      - init_repo
      - build_single_tag
      - install_pkg_sys_deps

  - title: 'Internal Helper Functions'
    desc: 'Internal helper functions used by the main workflow (typically not called directly)'
    contents:
      - acquire_pak_mutex
      - archive_single_package
      - check_build_skip_conditions
      - check_package_error
      - check_s3_packages
      - check_s3_root_package
      - classify_error_for_retry
      - clean_duplicated_packages
      - cleanup_stale_locks
      - clone_package_repo
      - clone_repository
      - determine_packages_to_build
      - execute_package_build
      - execute_package_builds
      - filter_packages_with_errors
      - filter_tags
      - find_old_versions
      - get_all_s3_packages
      - get_archive_path
      - get_minor_version
      - get_remote_search_path
      - get_system_architecture_info
      - handle_build_output_files
      - handle_post_build_actions
      - handle_system_dependencies
      - initialize_build_environment
      - list_archived_packages
      - move_and_rename_tarball
      - parse_package_tag_pairs
      - perform_aggressive_cleanup
      - process_tag_filtering
      - release_pak_mutex
      - remove_from_metadata
      - retry_with_backoff
      - run_pak_install_with_mutex
      - setup_installation_env_vars
      - store_build_metadata
