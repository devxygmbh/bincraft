url: https://bincraft.doc.rpkgs.com
template:
  bootstrap: 5
  light-switch: true
  bslib:
    bootswatch: yeti
    primary: "#306cc9"

    base_font: {google: "Roboto"}
    heading_font: {google: "Montserrat"}
    code_font: {google: "JetBrains Mono"}

reference:
  - title: Bootstrapping
  - contents:
      - init_repo
  - title: Build
    # desc: Functions related to building
  - contents:
      - starts_with("build_")
      - install_pkg_sys_deps
  - title: Upload & Archive
  - contents:
      - contains("archive")
      - contains("upload")
  - title: Metadata
  - contents:
      - contains("metadata")
  - title: Package Changes
  - contents:
      - contains("cran_packages")
      - process_cran_updates
      - process_cranberries_rss
      - get_cranberries_feed
  - title: Repo Index
  - contents:
      - contains("index")
  - title: Helpers
    contents:
      - check_for_binary
      - starts_with("set_")
      - starts_with("get_")
