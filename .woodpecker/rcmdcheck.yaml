when:
  - event: pull_request
    path: 'R/**'
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: 'R/**'

steps:
  'Check package':
    image: docker.io/devxygmbh/r-alpine:4.4-3.20
    pull: true
    environment:
      GITHUB_PAT:
        from_secret: GITHUB_PAT
      RCMDCHECK_NUM_COLORS: 300
      # PKG_SYSREQS: "TRUE"
      # PKG_SYSREQS_VERBOSE: "TRUE"
    commands:
      - R -q -e 'install.packages("pak", repos = sprintf("https://r-lib.github.io/p/pak/devel/%s/%s/%s", .Platform$pkgType, R.Version()$os, R.Version()$arch))'
      - R -q -e 'cmd = pak::pkg_sysreqs(".")$install_scripts; system(cmd)'
      - R -q -e 'options(Ncpus = 4)'
      - R -q -e 'install.packages("remotes")'
      - R -q -e 'remotes::install_deps(dependencies = TRUE, quiet = TRUE)'
      - R -q -e 'remotes::install_github("r-lib/rcmdcheck")'
      # - R -q -e 'pak::pak()'
      # - R -q -e 'pak::pak("rcmdcheck")'
      - R -q -e 'rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning")'
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 1300Mi
            cpu: 2000m
          limits:
            memory: 2000Mi
            cpu: 4000m
        tolerations:
          - key: 'CI'
            operator: 'Equal'
            value: 'true'
            effect: 'NoSchedule'