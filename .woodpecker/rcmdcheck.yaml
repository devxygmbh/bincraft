steps:
  'Check package':
    when:
      event: [push, pull_request]
    image: docker.io/devxygmbh/r-ubuntu:4.4-noble
    environment:
      GITHUB_PAT:
        from_secret: GITHUB_PAT
    commands:
      - R -q -s -e 'install.packages("pak")'
      - R -q -e 'options(Ncpus = 4)'
      - R -q -e 'pak::pak()'
      - R -q -e 'pak::pak("rcmdcheck")'
      - R -q -e 'rcmdcheck::rcmdcheck()'