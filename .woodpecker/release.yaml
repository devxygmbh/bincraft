when:
  - event: tag

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.6.2
    settings:
      tags: true

depends_on:
  - rcmdcheck

steps:
  changelog:
    image: docker.io/thegeeklab/git-sv:1.0.12
    commands:
      - git sv current-version
      - git sv release-notes -t ${CI_COMMIT_TAG} -o CHANGELOG.md
      - sed -i '1,2d' CHANGELOG.md # remove version
      - cat CHANGELOG.md
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 100Mi
            cpu: 100m
          limits:
            memory: 300Mi
            cpu: 1000m

  create_release:
    image: 'gitlab/glab:v1.54.0'
    environment:
      API_RW_TOKEN:
        from_secret: API_RW_TOKEN
    commands:
      - echo $API_RW_TOKEN | glab auth login --stdin
      - glab release create "${CI_COMMIT_TAG}" -F CHANGELOG.md
    when:
      event: [tag]
      branch: ${CI_REPO_DEFAULT_BRANCH}
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 100Mi
            cpu: 100m
          limits:
            memory: 300Mi
            cpu: 1000m