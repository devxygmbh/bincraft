# cSpell:ignore checkmake hadolint autofix autoupdate
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.7.0
    hooks:
      - id: editorconfig-checker
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c=.yamllint.yaml]
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3
    hooks:
      - id: roxygenize
        additional_dependencies:
          - cli
          - pat-s/cranlike@s3
          - data.table
          - DBI
          - dplyr
          - future
          - future.apply
          - gert
          - gh
          - httr2
          - lgr
          - lubridate
          - pak
          - pkgbuild
          - pkgsearch
          - purrr
          - s3fs
          - withr
          - pat-s/desc@description-from-remote
  - repo: local
    hooks:
      - id: yaml-file-extension
        name: Check if YAML files has *.yaml extension.
        entry: YAML filenames must have .yaml extension.
        language: fail
        files: .yml$
      - id: r-cmd-check
        name: R CMD check
        entry: Rscript -e "devtools::check(error_on = 'warning')"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
